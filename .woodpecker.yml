when:
  - event: [push, pull_request, manual]
    branch: [dev, production]

steps:
  test-and-build:
    image: node:20
    commands:
      - npm ci
      - npm run lint
      - npx tsc --noEmit
      - VITE_API_URL=http://localhost:5512 npm run build

  docker-build-dry-run:
    image: woodpeckerci/plugin-docker
    privileged: true
    settings:
      mtu: 1400
      dry_run: true
      repo: ghcr.io/automationland-dev/sdlc-platform-admin
      tags: latest
      build_args:
        - VITE_API_URL=http://localhost:5512
    when:
      - event: [push, pull_request, manual]
        branch: dev
      - event: pull_request
        branch: production

  docker-build-and-push:
    image: woodpeckerci/plugin-docker
    privileged: true
    settings:
      mtu: 1400
      registry: ghcr.io
      repo: ghcr.io/automationland-dev/sdlc-platform-admin
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      build_args_from_env:
        - VITE_API_URL
        - VITE_FRONTEND_URL
    when:
      - event: push
        branch: production

  deploy-to-vps:
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: vps_host
      username:
        from_secret: vps_user
      password:
        from_secret: vps_password
      envs:
        - vps_ghcr_pat
        - CI_REPO_OWNER
      script:
        - echo $vps_ghcr_pat | docker login ghcr.io -u $CI_REPO_OWNER --password-stdin
        - cd /opt/sdlc
        - docker pull ghcr.io/automationland-dev/sdlc-platform-admin:latest
        - docker compose up -d --no-build --no-deps admin
        - docker image ls "ghcr.io/automationland-dev/sdlc-platform-admin" --format "{{.Repository}}:{{.Tag}}" | grep "sha-" | sort -r | tail -n +3 | xargs docker rmi 2>/dev/null || true
        - |
          for i in $(seq 1 12); do
            CONTAINER=$(docker compose ps -q admin 2>/dev/null | head -1)
            STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER" 2>/dev/null)
            RESTARTS=$(docker inspect --format='{{.RestartCount}}' "$CONTAINER" 2>/dev/null)
            if [ "${RESTARTS:-0}" -gt 0 ]; then
              echo "DEPLOY FAILED: admin restarted ${RESTARTS} time(s) - crash loop detected"
              docker compose logs --tail=30 admin
              exit 1
            fi
            if [ "$STATUS" = "running" ]; then
              echo "Admin deployed OK (restarts=0, attempt=$i): $(date)"
              exit 0
            fi
            echo "Waiting... attempt $i/12 (status=${STATUS:-unknown})"
            sleep 5
          done
          echo "DEPLOY FAILED: admin did not reach running state after 60s"
          docker compose logs --tail=30 admin
          exit 1
    when:
      - event: push
        branch: production
