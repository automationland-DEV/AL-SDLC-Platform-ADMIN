when:
  - event: [push, pull_request, manual]
    branch: [dev, production]

steps:
  test-and-build:
    image: node:20-alpine
    commands:
      - npm ci
      - VITE_API_URL=https://api-sdlc-platform.automationland.vn npm run build
    when:
      - event: [pull_request]

  deploy-to-vps:
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: vps_host
      username:
        from_secret: vps_user
      password:
        from_secret: vps_password
      script:
        - set -e
        - cd /opt/sdlc
        - docker compose build --no-cache frontend-admin
        - docker compose up -d frontend-admin
        - docker image prune -f
    when:
      - event: [push, manual]
        branch: production
